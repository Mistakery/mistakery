    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <link rel="preload" as="image" type="image/webp" href="assets/live-agent-manifesto.webp?v=91aac6e47bbd">
    <link rel="preload" as="image" type="image/webp" href="assets/live-agent-judgment-day.webp">

    <script src="assets/loss-finale-data.js?v=1a459e659c5b" defer></script>

  <script src="app.js?v=4b10a6e96caf" defer></script>
  </head>
  <body>
    <main class="app" data-app>
      <h1>Mistakery</h1>
      <nav class="test-controls" data-test-controls aria-label="Story testing" hidden>
        <span>Test mode</span>
        <button type="button" data-test-inspect aria-label="Перевод и ресурсы" aria-haspopup="dialog">RU / ±</button>
        <button type="button" data-test-back disabled>← Back</button>
        <button type="button" data-test-restart>Restart story</button>
        <div class="hud-switcher" role="group" aria-label="Вид ресурсов" hidden>
          <button type="button" data-hud-variant="pulse" aria-pressed="true">Пульс шкал</button>
          <button type="button" data-hud-variant="icons" aria-pressed="false">Живые иконки</button>
        </div>
      </nav>
      <div class="frame">
        <section class="phone" data-game data-view="loading" data-shell-stage="intro" aria-label="Mistakery game">
          <header class="top" data-top hidden>
            <div class="brand"><b>B2BuyerSpyer</b><span>AI-POWERED</span></div>
            <button class="quit" type="button" data-restart-run disabled>Relaunch</button>
          </header>

          <div class="resources" data-resources aria-label="Startup resources" hidden></div>

          <section class="messenger-scene scene--card personal-scene" data-scene>
            <div class="outcome-glow" aria-hidden="true"></div>
            <header class="contact">
              <div class="avatar" data-avatar aria-hidden="true">M</div>
              <div class="contact__text"><b data-sender>Mistakery</b><i data-status>typing...</i></div>
              <button class="sound-toggle" type="button" data-sound-toggle aria-label="Mute sounds" aria-pressed="true" title="Mute sounds">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><g class="sound-on"><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></g><path class="sound-off" d="m16 9 5 6m0-6-5 6"/></svg>
              </button>
            </header>

            <div class="irl-location" data-location hidden>
              <span class="pin" aria-hidden="true">📍</span>
              <span><small></small><b data-location-score></b></span>
            </div>

            <section class="run-ending" data-ending-summary role="status" hidden>
              <small>GAME OVER · YOU LOST</small>
              <h2 data-ending-title></h2>
              <p data-ending-cause></p>
            </section>

            <div class="chat" data-chat aria-live="polite">
              <span class="sr-only" data-card-id></span>
              <div class="message-row">
                <div class="mini-avatar message-avatar" data-message-avatar aria-hidden="true">M</div>
                <div class="message-stack" data-message-stack>
                  <div class="message"><p data-message>Opening Mistakery…</p></div>
                </div>
              </div>
            </div>

            <div class="reply-hint-dock" data-reply-hint hidden>
              <div class="reply-hint">
                <span class="reply-hint__text">Choose a reply...</span>
                <span class="reply-hint__arrow" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
                </span>
              </div>
            </div>

            <footer class="choices" data-choices></footer>
          </section>

        </section>
      </div>
    </main>
    <dialog class="test-details" data-test-details aria-labelledby="details-title" lang="ru">
      <header class="test-details__head">
        <div><small data-details-id></small><h2 id="details-title">Перевод и ресурсы</h2></div>
        <button type="button" data-details-close aria-label="Закрыть" autofocus>✕</button>
      </header>
      <div class="test-details__body" data-details-body></div>
    </dialog>
  </body>
</html>
